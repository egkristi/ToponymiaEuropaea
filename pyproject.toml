[project]
name = "toponymia-europaea"
version = "0.1.0"
description = "An open research framework for systematic analysis of European place names"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.12"
authors = [
    { name = "Erling Kristiansen" },
]
keywords = ["toponymy", "place-names", "onomastics", "geospatial", "linguistics", "NLP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Core
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.14",
    # Geospatial
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    # Data
    "httpx>=0.27",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    # NLP
    "spacy>=3.7",
    # Statistics
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    # CLI
    "typer>=0.9",
    "rich>=13.7",
    # Configuration
    "tomli>=2.0; python_version < '3.11'",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.10",
    "arviz>=0.17",
]
ml = [
    "transformers>=4.37",
    "torch>=2.1",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
toponymia = "toponymia.cli:app"

[project.urls]
Repository = "https://github.com/egkristi/ToponymiaEuropaea"
Documentation = "https://egkristi.github.io/ToponymiaEuropaea"
Issues = "https://github.com/egkristi/ToponymiaEuropaea/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toponymia"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["toponymia"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring database connection",
]

[tool.coverage.run]
source = ["src/toponymia"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
