<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toponymia Europaea — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa;
            color: #2c3e50;
        }
        header {
            background: #1a1a2e;
            color: #eee;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        header nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
        }
        header nav a:hover { color: #fff; }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 { font-size: 0.8rem; text-transform: uppercase; color: #888; margin-bottom: 8px; }
        .card .value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 0 24px 24px;
        }
        .chart-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-card h2 { font-size: 1rem; margin-bottom: 12px; color: #1a1a2e; }
        canvas { max-height: 300px; }
        @media (max-width: 768px) {
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Toponymia Europaea — Dashboard</h1>
        <nav>
            <a href="index.html">Browse</a>
            <a href="map.html">Map</a>
            <a href="docs.html">Docs</a>
        </nav>
    </header>

    <div class="summary" id="summary">
        <div class="card"><h3>Total Places</h3><div class="value" id="total">—</div></div>
        <div class="card"><h3>Countries</h3><div class="value" id="countries">—</div></div>
        <div class="card"><h3>Sources</h3><div class="value" id="sources">—</div></div>
    </div>

    <div class="charts">
        <div class="chart-card">
            <h2>Records by Country</h2>
            <canvas id="chart-country"></canvas>
        </div>
        <div class="chart-card">
            <h2>Records by Source</h2>
            <canvas id="chart-source"></canvas>
        </div>
    </div>

    <script>
        const COUNTRY_NAMES = {
            NO: 'Norway', SE: 'Sweden', DK: 'Denmark',
            FI: 'Finland', IS: 'Iceland',
        };
        const COLORS = ['#e74c3c', '#3498db', '#27ae60', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#2c3e50'];

        async function loadDashboard() {
            try {
                const [statsResp, sourcesResp] = await Promise.all([
                    fetch('./data/stats.json'),
                    fetch('./data/sources.json'),
                ]);

                if (!statsResp.ok) throw new Error(`Stats: HTTP ${statsResp.status}`);
                if (!sourcesResp.ok) throw new Error(`Sources: HTTP ${sourcesResp.status}`);

                const stats = await statsResp.json();
                const sources = await sourcesResp.json();

                // Summary cards
                document.getElementById('total').textContent = stats.total_places.toLocaleString();
                document.getElementById('countries').textContent = Object.keys(stats.by_country).length;
                document.getElementById('sources').textContent = sources.length;

                // Country chart
                const countryLabels = Object.keys(stats.by_country).map(c => COUNTRY_NAMES[c] || c);
                const countryValues = Object.values(stats.by_country);

                new Chart(document.getElementById('chart-country'), {
                    type: 'doughnut',
                    data: {
                        labels: countryLabels,
                        datasets: [{
                            data: countryValues,
                            backgroundColor: COLORS.slice(0, countryLabels.length),
                        }],
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom' } },
                    },
                });

                // Source chart
                const sourceLabels = Object.keys(stats.by_source);
                const sourceValues = Object.values(stats.by_source);

                new Chart(document.getElementById('chart-source'), {
                    type: 'bar',
                    data: {
                        labels: sourceLabels,
                        datasets: [{
                            label: 'Records',
                            data: sourceValues,
                            backgroundColor: '#3498db',
                        }],
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } },
                    },
                });
            } catch (err) {
                console.error('Dashboard load error:', err);
                document.getElementById('total').textContent = 'Error';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
