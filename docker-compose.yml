services:
  db:
    image: postgis/postgis:16-3.4
    container_name: toponymia-db
    environment:
      POSTGRES_DB: toponymia
      POSTGRES_USER: toponymia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toponymia_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toponymia"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
