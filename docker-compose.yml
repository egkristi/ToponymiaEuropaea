services:
  db:
    image: postgis/postgis:16-3.4
    container_name: toponymia-db
    environment:
      POSTGRES_DB: toponymia
      POSTGRES_USER: toponymia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toponymia_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toponymia"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: toponymia-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://toponymia:${POSTGRES_PASSWORD:-toponymia_dev}@db:5432/toponymia
      PARQUET_PATH: /data/parquet
    volumes:
      - ./databank:/data/databank:ro
      - parquet_data:/data/parquet
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    container_name: toponymia-seed
    environment:
      DATABASE_URL: postgresql://toponymia:${POSTGRES_PASSWORD:-toponymia_dev}@db:5432/toponymia
      PARQUET_PATH: /data/parquet
    volumes:
      - ./databank:/data/databank:ro
      - parquet_data:/data/parquet
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  pgdata:
  parquet_data:
